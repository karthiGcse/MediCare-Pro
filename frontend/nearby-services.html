<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MediCare — Nearby Services</title><link rel="stylesheet" href="portal.css"></head>
<body><div class="portal-shell">
<header class="portal-header"><div class="portal-brand"><img src="Logo.png" alt="MediCare"><span>MediCare</span></div><div class="portal-actions"><button class="portal-btn secondary" onclick="history.back()">Back</button><button class="portal-btn" data-signout>Sign out</button></div></header>
<h1 class="portal-title">Nearby Healthcare Services</h1><p class="portal-subtitle">Uses your device location and Google Places to show real nearby places. Location is requested only when you start a search.</p>
<section class="portal-card"><div class="portal-actions"><button class="portal-btn" data-type="doctor">Doctors & Clinics</button><button class="portal-btn" data-type="hospital">Hospitals</button><button class="portal-btn" data-type="pharmacy">Pharmacies</button><button class="portal-btn" data-type="medical_lab">Labs</button></div><div id="placesResults" style="margin-top:18px"><div class="portal-empty">Choose a service to search nearby.</div></div></section>
</div>
<script src="js/firebase-config.js"></script><script type="module" src="js/firebase-client.js"></script><script src="js/cloud-auth.js"></script><script src="portal.js"></script>
<script>document.addEventListener('medicare:portal-ready',({detail})=>{const {cloud}=detail;document.querySelectorAll('[data-type]').forEach(button=>button.addEventListener('click',()=>{const box=document.getElementById('placesResults');if(!navigator.geolocation){box.innerHTML='<div class="portal-status portal-danger">Location is not supported by this browser.</div>';return;}box.innerHTML='<div class="portal-empty">Requesting your location...</div>';navigator.geolocation.getCurrentPosition(async pos=>{try{const token=await cloud.auth.currentUser.getIdToken();const params=new URLSearchParams({lat:String(pos.coords.latitude),lng:String(pos.coords.longitude),type:button.dataset.type});const r=await fetch('/api/places/nearby?'+params,{headers:{Authorization:'Bearer '+token}});const data=await r.json();if(!r.ok)throw new Error(data.message||'Nearby search failed');box.innerHTML=data.results?.length?data.results.map(p=>`<div class="portal-record"><strong>${portalEscape(p.displayName?.text||'Healthcare place')}</strong><div>${portalEscape(p.formattedAddress||'')}</div>${p.googleMapsUri?`<a href="${p.googleMapsUri}" target="_blank" rel="noopener">Open in Google Maps</a>`:''}</div>`).join(''):'<div class="portal-empty">No live places were returned for this area.</div>';}catch(err){console.error(err);box.innerHTML=`<div class="portal-status portal-danger">${portalEscape(err.message)}</div>`;}},()=>{box.innerHTML='<div class="portal-status portal-danger">Location permission was not granted.</div>';},{enableHighAccuracy:false,timeout:10000,maximumAge:300000});}));});</script>
</body></html>
